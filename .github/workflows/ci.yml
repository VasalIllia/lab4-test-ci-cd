name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.9"

      - name: Start LocalStack with Docker Compose
        run: docker compose up -d  

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run pylint
        run: pylint --fail-under=7 app

      - name: Run BDD tests
        run: behave tests/features

      - name: Run unit tests
        run: pytest tests/test_case.py -v

      - name: Run integration tests
        run: |
            pytest tests/test_integration.py --maxfail=1 --disable-warnings -v
            coverage run -a -m pytest tests/test_integration.py --maxfail=1 --disable-warnings -v
            coverage report -m

      - name: Teardown Docker
        if: always()
        run: docker compose down